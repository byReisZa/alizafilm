<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALİZA - Film & Dizi İzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="nav-logo">ALİZA</div>
    <div class="nav-links">
      <a class="active" data-category="all">Ana Sayfa</a>
      <a data-category="film">Filmler</a>
      <a data-category="dizi">Diziler</a>
    </div>
    <div class="nav-search">
      <input id="searchInput" type="text" placeholder="Ara...">
      <span>🔍</span>
    </div>
    <button class="btn-admin" onclick="location.href='admin.html'">Admin</button>
  </nav>

  <section class="hero">
    <h1>ALİZA</h1>
    <p>En kaliteli film ve dizileri ücretsiz izleyin.</p>
  </section>

  <div class="tabs">
    <button class="tab active" data-category="all">Tümü</button>
    <button class="tab" data-category="film">Filmler</button>
    <button class="tab" data-category="dizi">Diziler</button>
  </div>

  <div id="movieGrid" class="movie-grid"></div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Başlık</h2>
        <button class="modal-close" id="modalCloseBtn">✕</button>
      </div>
      <div class="player-wrap" id="playerWrap">
        <div class="no-embed">Yükleniyor...</div>
      </div>
      <div class="modal-body">
        <span id="modalBadge" class="badge badge-film"></span>
        <p id="modalDesc"></p>
      </div>
    </div>
  </div>

  <footer>
    ALİZA &copy; 2026 &mdash; Tüm hakları saklıdır.
  </footer>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
