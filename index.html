İşte size ALIZA adında, film ve dizi ekleyebileceğiniz, mobil uyumlu, full ekran destekli ve admin paneli bulunan bir izleme sitesinin kodları.
```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ALIZA | Film & Dizi İzle</title>
    <!-- Font Awesome 6 (ücretsiz ikonlar) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* style.css - tamamen entegre, mobil öncelikli modern tasarım */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c10;
            color: #eef2ff;
            line-height: 1.5;
        }

        /* scroll bar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1f2a;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff4757;
            border-radius: 8px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* HEADER */
        .header {
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 0;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4757, #ff6a4b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .logo span {
            font-size: 0.75rem;
            background: #2c2f3a;

        }
        .admin-area {
            display: flex;

            align-items: center;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #ff4757;

            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .btn-outline:hover {
            background: #ff4757;

        }
        .btn-primary {
            background: #ff4757;
            border: none;

            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #e03a48;
            transform: scale(0.97);
        }

        /* search & filter */
        .search-bar {
            margin: 30px 0 20px;
        }
        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 60px;
            border: none;
            background: #1e2129;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        .search-bar input:focus {
            background: #2a2e38;
            box-shadow: 0 0 0 2px #ff4757;
        }

        /* TABS (film / dizi) */
        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            border-bottom: 1px solid #2a2e38;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            font-weight: 600;
            color: #8e94a8;
            cursor: pointer;
            padding: 5px 0;
            transition: 0.2s;
        }
        .tab-btn.active {
            color: #ff4757;
            border-bottom: 2px solid #ff4757;
        }

        /* GRID kartlar */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }
        .card {
            background: #14171f;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.25s, box-shadow 0.2s;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .card-img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background: #0b0d12;
        }
        .card-info {
            padding: 12px;
        }
        .card-title {
            font-weight: 700;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-type {
            font-size: 0.7rem;
            color: #ff4757;
            margin-top: 5px;
        }

        /* MODAL (video oynatıcı + bölüm seçimi) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .modal-content {
            width: 95%;
            max-width: 1100px;
            background: #101216;
            border-radius: 28px;
            overflow: hidden;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .video-container {
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            max-height: 70vh;
            outline: none;
        }
        .modal-info {
            padding: 20px;
        }
        .season-episode-panel {
            margin-top: 15px;
            background: #1a1d27;
            border-radius: 20px;
            padding: 15px;
        }
        .lang-switch {
            display: flex;
            gap: 12px;
            margin: 15px 0;
        }
        .lang-btn {
            background: #2a2e3f;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }
        .lang-btn.active-lang {
            background: #ff4757;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 32px;
            color: white;
            cursor: pointer;
            background: rgba(0,0,0,0.6);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1010;
        }
        /* admin panel */
        .admin-panel {
            background: #0e1017;
            border-radius: 28px;
            padding: 20px;
            margin: 30px 0;
            border: 1px solid #2c2f3a;
        }
        .admin-section {
            display: none;
        }
        .admin-section.active-admin {
            display: block;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            background: #1e212c;
            border: 1px solid #2f3340;
            color: white;
            font-family: inherit;
        }
        .admin-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* responsive */
        @media (max-width: 640px) {
            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }
            .modal-content {
                width: 98%;
            }
            .btn-outline, .btn-primary {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
            .logo h1 {
                font-size: 1.5rem;
            }
        }
        .empty-msg {
            text-align: center;
            padding: 50px;
            color: #6c7293;
        }
        i {
            margin-right: 6px;
        }
        .episode-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .episode-badge {
            background: #2c2f44;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .episode-badge:hover, .season-selector button:hover {
            background: #ff4757;
        }
        .season-selector {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .season-btn {
            background: #262a36;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
        }
        .active-season {
            background: #ff4757;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="container header-content">
        <div class="logo">
            <h1>ALIZA <span>izle</span></h1>
        </div>
        <div class="admin-area">
            <button id="adminLoginBtn" class="btn-outline"><i class="fas fa-lock"></i> Admin Girişi</button>
            <button id="logoutBtn" class="btn-outline" style="display: none;"><i class="fas fa-sign-out-alt"></i> Çıkış</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Film veya dizi ara...">
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="movies">🎬 Filmler</button>
        <button class="tab-btn" data-tab="series">📺 Diziler</button>
    </div>

    <div id="moviesContainer" class="media-grid"></div>
    <div id="seriesContainer" class="media-grid" style="display: none;"></div>

    <!-- Admin Panel (giriş yapınca görünür) -->
    <div id="adminPanelWrapper" style="display: none;">
        <div class="admin-panel">
            <h3><i class="fas fa-crown"></i> Yönetim Paneli</h3>
            <div class="admin-buttons" style="margin-bottom: 20px;">
                <button id="showAddFilmBtn" class="btn-primary"><i class="fas fa-film"></i> Film Ekle</button>
                <button id="showAddSeriesBtn" class="btn-primary"><i class="fas fa-tv"></i> Dizi Ekle</button>
                <button id="showAddEpisodeBtn" class="btn-outline"><i class="fas fa-plus-circle"></i> Diziye Bölüm Ekle</button>
            </div>
            <!-- Film ekleme -->
            <div id="addFilmForm" class="admin-section">
                <h4>Yeni Film</h4>
                <div class="form-group"><input type="text" id="filmTitle" placeholder="Film Adı"></div>
                <div class="form-group"><textarea id="filmDesc" placeholder="Açıklama"></textarea></div>
                <div class="form-group"><input type="text" id="filmPoster" placeholder="Poster URL (resim linki)"></div>
                <div class="form-group"><input type="text" id="filmTurkish" placeholder="Türkçe Dublaj Video URL"></div>
                <div class="form-group"><input type="text" id="filmOriginal" placeholder="Orijinal Dil Video URL"></div>
                <button id="saveFilmBtn" class="btn-primary">Filmi Kaydet</button>
            </div>
            <!-- Dizi ekleme (sadece iskelet) -->
            <div id="addSeriesForm" class="admin-section">
                <h4>Yeni Dizi</h4>
                <div class="form-group"><input type="text" id="seriesTitle" placeholder="Dizi Adı"></div>
                <div class="form-group"><textarea id="seriesDesc" placeholder="Açıklama"></textarea></div>
                <div class="form-group"><input type="text" id="seriesPoster" placeholder="Poster URL"></div>
                <button id="saveSeriesBtn" class="btn-primary">Diziyi Oluştur</button>
            </div>
            <!-- Bölüm ekleme -->
            <div id="addEpisodeForm" class="admin-section">
                <h4>Diziye Bölüm/Sezon Ekle</h4>
                <div class="form-group">
                    <select id="episodeSeriesSelect"></select>
                </div>
                <div class="form-group"><input type="number" id="seasonNum" placeholder="Sezon (örn: 1)"></div>
                <div class="form-group"><input type="number" id="episodeNum" placeholder="Bölüm No"></div>
                <div class="form-group"><input type="text" id="episodeTitle" placeholder="Bölüm Başlığı (opsiyonel)"></div>
                <div class="form-group"><input type="text" id="episodeTurkishUrl" placeholder="Türkçe Dublaj Video URL"></div>
                <div class="form-group"><input type="text" id="episodeOriginalUrl" placeholder="Orijinal Dil Video URL"></div>
                <button id="saveEpisodeBtn" class="btn-primary">Bölümü Ekle</button>
            </div>
        </div>
    </div>
</div>

<!-- Video Modal -->
<div id="videoModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div class="video-container">
            <video id="mainVideoPlayer" controls style="width:100%;"></video>
        </div>
        <div class="modal-info">
            <h3 id="modalTitle"></h3>
            <div class="lang-switch" id="langSwitchArea">
                <button class="lang-btn active-lang" data-lang="turkish">🇹🇷 Türkçe Dublaj</button>
                <button class="lang-btn" data-lang="original">🎬 Orijinal Dil</button>
            </div>
            <div id="episodesArea" style="margin-top: 10px;"></div>
        </div>
    </div>
</div>

<script>
    // ---------- script.js ----------
    // Varsayılan veri yapısı (localStorage)
    let appData = {
        movies: [],
        series: []
    };

    // Admin oturum durumu
    let isAdminLogged = false;

    // DOM elemanları
    const moviesContainer = document.getElementById('moviesContainer');
    const seriesContainer = document.getElementById('seriesContainer');
    const searchInput = document.getElementById('searchInput');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const adminPanelWrapper = document.getElementById('adminPanelWrapper');
    const adminLoginBtn = document.getElementById('adminLoginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const videoModal = document.getElementById('videoModal');
    const mainVideo = document.getElementById('mainVideoPlayer');
    const modalTitleSpan = document.getElementById('modalTitle');
    const episodesArea = document.getElementById('episodesArea');

    // Admin panel formları
    const addFilmFormDiv = document.getElementById('addFilmForm');
    const addSeriesFormDiv = document.getElementById('addSeriesForm');
    const addEpisodeFormDiv = document.getElementById('addEpisodeForm');
    const episodeSeriesSelect = document.getElementById('episodeSeriesSelect');

    // Load / Save localStorage
    function loadData() {
        const stored = localStorage.getItem('ALIZA_DATA');
        if(stored) {
            appData = JSON.parse(stored);
        } else {
            // Örnek demo içerik
            appData = {
                movies: [
                    { id: "m1", title: "Örnek Film", description: "Harika bir aksiyon filmi", poster: "https://picsum.photos/id/100/300/450", turkceURL: "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", orijinalURL: "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" }
                ],
                series: [
                    { id: "s1", title: "Örnek Dizi", description: "Popüler bir dizi", poster: "https://picsum.photos/id/104/300/450", seasons: [ { seasonNumber: 1, episodes: [ { episodeNumber: 1, title: "İlk Bölüm", turkceURL: "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunflies.mp4", orijinalURL: "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunflies.mp4" } ] } ] }
                ]
            };
        }
        saveData();
    }
    function saveData() {
        localStorage.setItem('ALIZA_DATA', JSON.stringify(appData));
    }

    // Render ana sayfa
    let currentTab = 'movies';
    let searchTerm = '';

    function renderMovies() {
        let filtered = appData.movies.filter(m => m.title.toLowerCase().includes(searchTerm.toLowerCase()));
        if(filtered.length === 0) {
            moviesContainer.innerHTML = `<div class="empty-msg"><i class="fas fa-film"></i> Film bulunamadı</div>`;
            return;
        }
        moviesContainer.innerHTML = filtered.map(movie => `
            <div class="card" data-id="${movie.id}" data-type="movie">
                <img class="card-img" src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://picsum.photos/id/1/300/450'">
                <div class="card-info">
                    <div class="card-title">${movie.title}</div>
                    <div class="card-type">🎬 Film</div>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.card[data-type="movie"]').forEach(card => {
            card.addEventListener('click', (e) => {
                const id = card.getAttribute('data-id');
                const movie = appData.movies.find(m => m.id === id);
                if(movie) openMovieModal(movie);
            });
        });
    }

    function renderSeries() {
        let filtered = appData.series.filter(s => s.title.toLowerCase().includes(searchTerm.toLowerCase()));
        if(filtered.length === 0) {
            seriesContainer.innerHTML = `<div class="empty-msg"><i class="fas fa-tv"></i> Dizi bulunamadı</div>`;
            return;
        }
        seriesContainer.innerHTML = filtered.map(ser => `
            <div class="card" data-id="${ser.id}" data-type="series">
                <img class="card-img" src="${ser.poster}" alt="${ser.title}" onerror="this.src='https://picsum.photos/id/2/300/450'">
                <div class="card-info">
                    <div class="card-title">${ser.title}</div>
                    <div class="card-type">📺 Dizi</div>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.card[data-type="series"]').forEach(card => {
            card.addEventListener('click', (e) => {
                const id = card.getAttribute('data-id');
                const series = appData.series.find(s => s.id === id);
                if(series) openSeriesModal(series);
            });
        });
    }

    let currentSeriesObject = null;
    let currentSeason = 1;
    let currentEpisodeObj = null;
    let currentLanguage = 'turkish'; // turkish or original

    function openMovieModal(movie) {
        currentSeriesObject = null;
        episodesArea.style.display = 'none';
        modalTitleSpan.innerText = movie.title;
        // Dil butonlarını göster
        document.getElementById('langSwitchArea').style.display = 'flex';
        // video url seç
        setVideoByLang(movie.turkceURL, movie.orijinalURL);
        currentEpisodeObj = { turkceURL: movie.turkceURL, orijinalURL: movie.orijinalURL };
        videoModal.style.display = 'flex';
    }

    function openSeriesModal(series) {
        currentSeriesObject = series;
        currentSeason = (series.seasons && series.seasons.length > 0) ? series.seasons[0].seasonNumber : 1;
        modalTitleSpan.innerText = series.title;
        episodesArea.style.display = 'block';
        renderSeasonEpisodes(series);
        // ilk bölümü oynat
        const firstSeason = series.seasons.find(s => s.seasonNumber === currentSeason);
        if(firstSeason && firstSeason.episodes.length > 0) {
            currentEpisodeObj = firstSeason.episodes[0];
            setVideoByLang(currentEpisodeObj.turkceURL, currentEpisodeObj.orijinalURL);
        } else {
            mainVideo.src = '';
        }
        videoModal.style.display = 'flex';
    }

    function renderSeasonEpisodes(series) {
        const seasonsList = series.seasons.map(s => s.seasonNumber).sort((a,b)=>a-b);
        let seasonHtml = `<div class="season-selector">`;
        seasonsList.forEach(sea => {
            seasonHtml += `<button class="season-btn ${currentSeason === sea ? 'active-season' : ''}" data-season="${sea}">${sea}. Sezon</button>`;
        });
        seasonHtml += `</div>`;
        const selectedSeasonData = series.seasons.find(s => s.seasonNumber === currentSeason);
        let episodesHtml = `<div class="episode-list">`;
        if(selectedSeasonData) {
            selectedSeasonData.episodes.forEach(ep => {
                episodesHtml += `<div class="episode-badge" data-episode='${JSON.stringify(ep)}'>${ep.episodeNumber}. Bölüm ${ep.title ? '- '+ep.title : ''}</div>`;
            });
        }
        episodesHtml += `</div>`;
        episodesArea.innerHTML = seasonHtml + episodesHtml;
        document.querySelectorAll('.season-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentSeason = parseInt(btn.getAttribute('data-season'));
                renderSeasonEpisodes(currentSeriesObject);
                const newSeasonData = currentSeriesObject.seasons.find(s => s.seasonNumber === currentSeason);
                if(newSeasonData && newSeasonData.episodes.length) {
                    currentEpisodeObj = newSeasonData.episodes[0];
                    setVideoByLang(currentEpisodeObj.turkceURL, currentEpisodeObj.orijinalURL);
                }
            });
        });
        document.querySelectorAll('.episode-badge').forEach(epDiv => {
            epDiv.addEventListener('click', () => {
                const ep = JSON.parse(epDiv.getAttribute('data-episode'));
                currentEpisodeObj = ep;
                setVideoByLang(ep.turkceURL, ep.orijinalURL);
            });
        });
    }

    function setVideoByLang(turkishUrl, originalUrl) {
        if(currentLanguage === 'turkish') {
            mainVideo.src = turkishUrl;
        } else {
            mainVideo.src = originalUrl;
        }
        mainVideo.load();
        mainVideo.play().catch(e=>console.log);
    }

    // dil değiştirme eventleri
    function bindLanguageEvents() {
        const turkBtn = document.querySelector('.lang-btn[data-lang="turkish"]');
        const origBtn = document.querySelector('.lang-btn[data-lang="original"]');
        if(turkBtn && origBtn) {
            turkBtn.onclick = () => {
                currentLanguage = 'turkish';
                turkBtn.classList.add('active-lang');
                origBtn.classList.remove('active-lang');
                if(currentEpisodeObj) setVideoByLang(currentEpisodeObj.turkceURL, currentEpisodeObj.orijinalURL);
            };
            origBtn.onclick = () => {
                currentLanguage = 'original';
                origBtn.classList.add('active-lang');
                turkBtn.classList.remove('active-lang');
                if(currentEpisodeObj) setVideoByLang(currentEpisodeObj.turkceURL, currentEpisodeObj.orijinalURL);
            };
        }
    }

    // Admin işlemleri
    function updateAdminUI() {
        if(isAdminLogged) {
            adminPanelWrapper.style.display = 'block';
            adminLoginBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-flex';
            // dizi select güncelle
            populateSeriesSelect();
        } else {
            adminPanelWrapper.style.display = 'none';
            adminLoginBtn.style.display = 'inline-flex';
            logoutBtn.style.display = 'none';
        }
    }

    function populateSeriesSelect() {
        episodeSeriesSelect.innerHTML = '<option value="">Dizi Seçin</option>';
        appData.series.forEach(ser => {
            episodeSeriesSelect.innerHTML += `<option value="${ser.id}">${ser.title}</option>`;
        });
    }

    // Film ekle
    document.getElementById('saveFilmBtn')?.addEventListener('click', () => {
        const title = document.getElementById('filmTitle').value;
        if(!title) return alert("Film adı gerekli");
        const newFilm = {
            id: Date.now() + "film",
            title: title,
            description: document.getElementById('filmDesc').value,
            poster: document.getElementById('filmPoster').value || "https://picsum.photos/id/20/300/450",
            turkceURL: document.getElementById('filmTurkish').value,
            orijinalURL: document.getElementById('filmOriginal').value
        };
        if(!newFilm.turkceURL) newFilm.turkceURL = "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
        if(!newFilm.orijinalURL) newFilm.orijinalURL = newFilm.turkceURL;
        appData.movies.push(newFilm);
        saveData();
        renderMovies();
        clearFilmForm();
        alert("Film eklendi!");
    });
    function clearFilmForm() {
        document.getElementById('filmTitle').value = '';
        document.getElementById('filmDesc').value = '';
        document.getElementById('filmPoster').value = '';
        document.getElementById('filmTurkish').value = '';
        document.getElementById('filmOriginal').value = '';
    }

    // Dizi ekle
    document.getElementById('saveSeriesBtn')?.addEventListener('click', () => {
        const title = document.getElementById('seriesTitle').value;
        if(!title) return alert("Dizi adı gerekli");
        const newSeries = {
            id: Date.now() + "series",
            title: title,
            description: document.getElementById('seriesDesc').value,
            poster: document.getElementById('seriesPoster').value || "https://picsum.photos/id/30/300/450",
            seasons: []
        };
        appData.series.push(newSeries);
        saveData();
        renderSeries();
        document.getElementById('seriesTitle').value = '';
        document.getElementById('seriesDesc').value = '';
        document.getElementById('seriesPoster').value = '';
        populateSeriesSelect();
        alert("Dizi oluşturuldu! Şimdi bölüm ekleyebilirsiniz.");
    });

    // Bölüm ekle
    document.getElementById('saveEpisodeBtn')?.addEventListener('click', () => {
        const seriesId = episodeSeriesSelect.value;
        if(!seriesId) return alert("Lütfen bir dizi seçin");
        const seasonNum = parseInt(document.getElementById('seasonNum').value);
        const episodeNum = parseInt(document.getElementById('episodeNum').value);
        if(isNaN(seasonNum) || isNaN(episodeNum)) return alert("Sezon ve bölüm numarası girin");
        const turkUrl = document.getElementById('episodeTurkishUrl').value;
        const origUrl = document.getElementById('episodeOriginalUrl').value;
        if(!turkUrl) return alert("Türkçe dublaj URL zorunlu");
        const episodeTitle = document.getElementById('episodeTitle').value || `Bölüm ${episodeNum}`;
        const seriesIndex = appData.series.findIndex(s => s.id === seriesId);
        if(seriesIndex === -1) return;
        let series = appData.series[seriesIndex];
        let seasonIndex = series.seasons.findIndex(s => s.seasonNumber === seasonNum);
        if(seasonIndex === -1) {
            series.seasons.push({ seasonNumber: seasonNum, episodes: [] });
            seasonIndex = series.seasons.length-1;
        }
        const newEpisode = {
            episodeNumber: episodeNum,
            title: episodeTitle,
            turkceURL: turkUrl,
            orijinalURL: origUrl || turkUrl
        };
        series.seasons[seasonIndex].episodes.push(newEpisode);
        // bölüm sırala
        series.seasons[seasonIndex].episodes.sort((a,b)=>a.episodeNumber-b.episodeNumber);
        saveData();
        renderSeries();
        alert("Bölüm eklendi!");
        document.getElementById('seasonNum').value = '';
        document.getElementById('episodeNum').value = '';
        document.getElementById('episodeTitle').value = '';
        document.getElementById('episodeTurkishUrl').value = '';
        document.getElementById('episodeOriginalUrl').value = '';
        populateSeriesSelect();
    });

</script>
